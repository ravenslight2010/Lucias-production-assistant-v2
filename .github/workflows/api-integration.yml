# Heavier API/DB integration path. Safe to expand as more integration suites land.
name: API integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-control-db:
    name: DB run-control tests
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install PostgreSQL client/server for initdb
        continue-on-error: true
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends postgresql postgresql-contrib || true
          command -v initdb || echo "initdb not available; run-control may skip/fail soft"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run control DB suite
        run: pnpm --filter @workspace/db run test:run-control
