# Heavier API/DB integration path. Soft when initdb is unavailable on the runner.
name: API integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-control-db:
    name: DB run-control tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check for initdb
        id: pg
        run: |
          if command -v initdb >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "initdb not on PATH — skipping disposable Postgres suite"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.pg.outputs.available == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.pg.outputs.available == 'true'
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        if: steps.pg.outputs.available == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run control DB suite
        if: steps.pg.outputs.available == 'true'
        run: pnpm --filter @workspace/db run test:run-control
