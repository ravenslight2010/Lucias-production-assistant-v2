# Heavier API/DB integration path. Missing PostgreSQL test prerequisites fail visibly.
name: API integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-control-db:
    name: DB run-control tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require PostgreSQL integration-test prerequisites
        run: |
          bash scripts/require-postgres-initdb.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run control DB suite
        run: pnpm --filter @workspace/db run test:run-control
