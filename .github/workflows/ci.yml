# V2 continuous integration — lean lanes that match current packages.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        env:
          PORT: "4173"
          BASE_PATH: /
        run: pnpm run build

  unit-tests:
    name: Unit and API tests
    runs-on: ubuntu-latest
    # Facility-invitation integration boots disposable Postgres under the hood.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: DB pool-config tests
        run: pnpm --filter @workspace/db run test:pool-config
      - name: API server unit tests (no local initdb)
        # facility-invitation.integration.test.mjs boots disposable Postgres via initdb;
        # run that under API integration once the runner image provides initdb reliably.
        run: |
          pnpm --filter @workspace/api-server run build
          pnpm --filter @workspace/api-server exec node --test \
            test/health.test.mjs \
            test/supervisor.test.mjs \
            test/db-pool-metrics.test.mjs

  security-audit:
    name: Security audit (prod deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependency tree
        run: pnpm audit --prod
