    RunRequirementsInput:
      type: object
      additionalProperties: false
      properties:
        productProfileId: {type: string, format: uuid}
        targetCases: {type: integer, minimum: 1, maximum: 1000000}
        review:
          $ref: "#/components/schemas/RunPlanningReview"
