        requirementName: {type: string}
        ingredientName: {type: string}
        unit: {type: string}
        source: {type: string}
        sourceAmount: {type: ["number", "null"]}
        quantityBasis: {type: string, enum: [per_pizza, per_batch, unresolved]}
        amountColumn: {type: ["string", "null"]}
        batchColumn: {type: ["integer", "null"]}
        proposedQuantity: {type: ["number", "null"]}
        blockedReason: {type: ["string", "null"]}
      required: [id, requirementId, requirementName, ingredientName, unit, source, sourceAmount, quantityBasis, amountColumn, batchColumn, proposedQuantity, blockedReason]
    RunInventoryUsageEntry:
