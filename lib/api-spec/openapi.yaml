    RunBatchColumn:
      type: object
      properties:
        column: {type: integer}
        label: {type: string}
        unit: {type: [string, "null"]}
        yield: {type: [number, "null"]}
      required: [column, label, unit, yield]
    RunRecipeChoice:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        brand: {type: string}
        kind: {type: string}
        source: {type: string}
        columns: {type: array, items: {$ref: "#/components/schemas/RunBatchColumn"}}
        issues: {type: array, items: {type: string}}
      required: [id, name, brand, kind, source, columns, issues]
    RunIngredientRequirement:
      type: object
