    RunInventoryUsageInput:
      type: object
      additionalProperties: false
      properties:
        commandId: {type: string, format: uuid}
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/RunInventoryUsageItemInput"
      required: [commandId, items]
    InventoryAdjustmentInput:
      type: object
      additionalProperties: false
      properties:
        commandId: {type: string, format: uuid}
        ingredientName: {type: string, minLength: 1, maxLength: 200}
        unit: {type: string, enum: [oz, lb, g, kg, each]}
        delta: {type: number, not: {const: 0}, minimum: -999999999999, maximum: 999999999999}
        note: {type: string, minLength: 3, maxLength: 500}
        correctsEntryId: {type: ["string", "null"], format: uuid}
      required: [commandId, ingredientName, unit, delta, note, correctsEntryId]
    FacilityInventoryItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        ingredientName: {type: string}
        unit: {type: string}
        onHand: {type: number}
        revision: {type: integer, minimum: 0}
