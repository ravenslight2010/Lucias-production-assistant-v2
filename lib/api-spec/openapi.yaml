        ingredientName: {type: string}
        unit: {type: string}
        kind: {type: string, enum: [run_usage, stock_adjustment, correction]}
        delta: {type: number}
        note: {type: string}
        runId: {type: ["string", "null"], format: uuid}
        reconciliationId: {type: ["string", "null"], format: uuid}
        correctsEntryId: {type: ["string", "null"], format: uuid}
        proposalId: {type: ["string", "null"]}
        requirementId: {type: ["string", "null"]}
        requirementName: {type: ["string", "null"]}
        sourceAmount: {type: ["number", "null"]}
        quantityBasis: {type: string, enum: [per_pizza, per_batch, unresolved]}
        source: {type: string}
        amountColumn: {type: ["string", "null"]}
        batchColumn: {type: ["integer", "null"]}
        proposedQuantity: {type: ["number", "null"]}
        actualUsed: {type: ["number", "null"]}
        createdAt: {type: string, format: date-time}
      required: [id, inventoryId, ingredientName, unit, kind, delta, note, runId, reconciliationId, correctsEntryId, proposalId, requirementId, requirementName, sourceAmount, quantityBasis, source, amountColumn, batchColumn, proposedQuantity, actualUsed, createdAt]
    FacilityInventoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FacilityInventoryItem"
