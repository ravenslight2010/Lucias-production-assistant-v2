openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Run-control API for Lucia's Production Assistant V2
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: facilities
    description: Facility setup and context
  - name: facility-members
    description: Facility membership and invitations
  - name: facility-stations
    description: Facility production station lineup
  - name: runs
    description: Facility-scoped production run control
  - name: product-profiles
    description: Imported facility product setup data
  - name: imports
    description: Facility workbook import history
  - name: facility-inventory
    description: On-hand ingredient stock and auditable adjustments
  - name: dashboard
    description: Production overview
paths:
  /v2/run-requirements/preview:
    post:
      operationId: previewRunRequirements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequirementsInput"
      responses:
        "200":
          description: Requirements calculated from current facility-scoped source records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunRequirementsPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /facility/context:
    get:
      operationId: getFacilityContext
      tags: [facilities]
      summary: Get the signed-in user's facility
      security:
        - clerkSession: []
      responses:
        "200":
          description: Facility context, or null before setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v2/session:
    post:
      operationId: createV2Session
      tags: [facilities]
      summary: Create an API session from the current Clerk session
      description: Issues a separate short-lived V2 cookie bound to the verified Clerk user and session. V1 cookies and credentials are never accepted.
      security:
        - clerkSession: []
      responses:
        "200":
          description: V2 session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteV2Session
      tags: [facilities]
      summary: Revoke the current API session
      security:
        - v2Session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session cookie cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
  /facilities:
    post:
      operationId: createFacility
      tags: [facilities]
      summary: Create a facility for the signed-in user
      security:
        - v2Session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityInput"
      responses:
        "201":
          description: Facility created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /facility/members:
    get:
      operationId: listFacilityMembers
      tags: [facility-members]
      summary: List facility members for an owner
      security:
        - v2Session: []
      responses:
        "200":
          description: Facility members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityMemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: inviteFacilityMember
      tags: [facility-members]
      summary: Add or invite a facility member
      description: Existing accounts are added immediately; new accounts receive a Clerk invitation with the selected facility role.
      security:
        - v2Session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityMemberInput"
      responses:
        "201":
          description: Member added or invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityMemberInviteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /facility/members/{memberId}:
    patch:
      operationId: updateFacilityMember
      tags: [facility-members]
      summary: Change a facility member role
      security:
        - v2Session: []
      parameters:
        - in: path
          name: memberId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityMemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeFacilityMember
      tags: [facility-members]
      summary: Remove a facility member
      security:
        - v2Session: []
      parameters:
        - in: path
          name: memberId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Member removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /facility/invitations/{invitationId}:
    delete:
      operationId: cancelFacilityInvitation
      tags: [facility-members]
      summary: Cancel a pending facility invitation
      security:
        - v2Session: []
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Invitation cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: Invitation could not be revoked in Clerk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /facility/stations:
    get:
      operationId: getFacilityStations
      tags: [facility-stations]
      summary: Get the facility's production station lineup
      security:
        - v2Session: []
      responses:
        "200":
          description: Ordered station lineup for the authenticated facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityStationLayout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateFacilityStations
      tags: [facility-stations]
      summary: Update the facility's production station lineup
      description: Owners and managers can rename, reorder, archive, or add stations. Existing station identities must be retained. A stale revision returns the current lineup.
      security:
        - v2Session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityStationLayoutUpdate"
      responses:
        "200":
          description: Updated station lineup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityStationLayout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The lineup changed on another device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityStationLayoutConflict"
  /v2/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List runs for the authenticated facility
      security:
        - v2Session: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Facility runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createRun
      tags: [runs]
      summary: Create a planned run
      description: Reusing requestId with identical setup returns the original run; reusing it with different setup returns 409.
      security:
        - v2Session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreateInput"
      responses:
        "201":
          description: Planned run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "200":
          description: Previously created run returned after an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v2/schedule-imports:
    post:
      operationId: importSchedule
      tags: [imports]
      summary: Create planned runs from a reviewed production schedule
      description: Rows before importDate are ignored. Repeating the same schedule with identical mappings is idempotent.
      security:
        - v2Session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleImportInput"
      responses:
        "201":
          description: Schedule imported and planned runs created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleImportResult"
        "200":
          description: Previously imported schedule returned after an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Schedule import request is too large
  /v2/name-library:
    get:
      operationId: getNameLibrary
      tags: [product-profiles]
      summary: List facility names, explicit aliases, and source usage
      security:
        - v2Session: []
      responses:
        "200":
          description: Name library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NameLibrary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: changeLibraryName
      tags: [product-profiles]
      summary: Rename or merge an explicitly reviewed name without changing formulas
      security:
        - v2Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryNameChange"
      responses:
        "200":
          description: Updated library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NameLibrary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Name library limit exceeded; no changes applied
  /v2/product-profiles:
    get:
      operationId: listProductProfiles
      tags: [product-profiles]
      summary: List product profiles for the authenticated facility
      security:
        - v2Session: []
      responses:
        "200":
          description: Facility product profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductProfileList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: importProductProfile
      tags: [product-profiles]
      summary: Save a reviewed workbook as facility product data
      security:
        - v2Session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductProfileImportInput"
      responses:
        "201":
          description: Product profile imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductProfileImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v2/import-batches:
    get:
      operationId: listImportBatches
      tags: [imports]
      summary: List recent workbook imports for the authenticated facility
      security:
        - v2Session: []
      responses:
        "200":
          description: Recent import history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v2/product-profiles/{profileId}:
    patch:
      operationId: renameProductProfile
      tags: [product-profiles]
      summary: Rename an imported product profile
      security:
        - v2Session: []
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductProfileRenameInput"
      responses:
        "200":
          description: Product profile renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v2/product-profiles/{profileId}/merge:
    post:
      operationId: mergeProductProfile
      tags: [product-profiles]
      summary: Preserve a product profile inside another profile
      security:
        - v2Session: []
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductProfileMergeInput"
      responses:
        "200":
          description: Profile data preserved in the destination profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductProfileMergeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Combined source data exceeds the profile size limit; neither profile was changed.
  /v2/runs/{runId}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get a run from the authenticated facility
      security:
        - v2Session: []
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Production run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v2/runs/{runId}/commands:
    post:
      operationId: applyRunCommand
      tags: [runs]
      summary: Apply a revision-guarded run lifecycle command
      security:
        - v2Session: []
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/RunCommandRequest"
      responses:
        "200":
          description: Command applied or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stale revision or invalid transition with the current state
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RunConflict"
                  - $ref: "#/components/schemas/InvalidTransition"
  /v2/runs/{runId}/stations:
    get:
      operationId: getRunStationProgress
      tags: [runs]
      summary: Get station progress for a run
      description: Station timers follow the production line timer. Starting, pausing, resuming, or completing a run updates every station in the saved lineup together.
      security:
        - v2Session: []
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Saved station progress or the current lineup preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStationProgressList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v2/runs/{runId}/quality-checks:
    get:
      operationId: getRunQualityChecks
      tags: [runs]
      summary: Review quality targets and recorded run measurements
      security:
        - v2Session: []
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Source-based quality targets and saved measurements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunQualityChecks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: recordRunQualityMeasurements
      tags: [runs]
      summary: Record measured weights for a run
      security:
        - v2Session: []
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunQualityMeasurementsInput"
      responses:
        "200":
          description: Saved run measurements and updated quality history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunQualityChecks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v2/runs/{runId}/inventory-usage:
    get:
      operationId: getRunInventoryUsage
      tags: [runs]
      summary: Review proposed and confirmed ingredient usage
      description: Proposals come from the saved run plan and saved station counts. Quantities are not deducted until an operator confirms actual use.
      security:
        - v2Session: []
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Current source-traced usage proposal and any completed reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunInventoryUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: confirmRunInventoryUsage
      tags: [runs]
      summary: Confirm actual ingredient usage for a completed run
      security:
        - v2Session: []
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunInventoryUsageInput"
      responses:
        "200":
          description: Confirmed actual usage and inventory deduction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunInventoryUsage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v2/inventory:
    get:
      operationId: getFacilityInventory
      tags: [facility-inventory]
      summary: Review on-hand stock and inventory history
      security:
        - v2Session: []
      responses:
        "200":
          description: Current facility balances and the latest inventory movements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityInventoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: adjustFacilityInventory
      tags: [facility-inventory]
      summary: Add opening stock or a reviewed inventory correction
      security:
        - v2Session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryAdjustmentInput"
      responses:
        "201":
          description: Inventory adjustment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityInventoryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v2/runs/{runId}/stations/{stationId}:
    patch:
      operationId: updateRunStationProgress
      tags: [runs]
      summary: Update production progress for a run station
      description: Saves station production counts and preparation readiness. Station timer state remains derived from the production line timer.
      security:
        - v2Session: []
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - in: path
          name: stationId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStationProgressUpdate"
      responses:
        "200":
          description: Saved station progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStationProgressUpdateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The station changed since it was loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStationProgressConflict"

  /v2/runs/{runId}/stations/{stationId}/count:
    put:
      operationId: updateRunStationCount
      tags: [runs]
      summary: Update completed case count at a run station
      security:
        - v2Session: []
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - in: path
          name: stationId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStationCountUpdate"
      responses:
        "200":
          description: Updated station counts and current run requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStationProgressList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the facility's run summary and recent activity
      security:
        - v2Session: []
      responses:
        "200":
          description: Facility production overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Sign in required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Facility access is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found in the signed-in user's facility
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State changed or command conflicts with current revision
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        api:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok, degraded]
        worker:
          type: string
          enum: [starting, available, restarting]
      required:
        - status
        - api
        - database
        - worker
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    FacilityStationArea:
      type: string
      enum: [dough_sauce_prep, production_line, freezing_packaging, warehouse]
    FacilityStation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 80
        area:
          $ref: "#/components/schemas/FacilityStationArea"
        isActive:
          type: boolean
      required: [id, name, area, isActive]
    FacilityStationInput:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 80
        area:
          $ref: "#/components/schemas/FacilityStationArea"
        isActive:
          type: boolean
      required: [name, area, isActive]
    FacilityStationLayout:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        stations:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/FacilityStation"
      required: [revision, stations]
    FacilityStationLayoutUpdate:
      type: object
      additionalProperties: false
      properties:
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        stations:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/FacilityStationInput"
      required: [expectedRevision, stations]
    FacilityStationLayoutConflict:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        current:
          $ref: "#/components/schemas/FacilityStationLayout"
      required: [error, current]
    RunStatus:
      type: string
      enum: [planned, running, paused, completed]
    RunStationProgressStatus:
      type: string
      enum: [not_started, in_progress, paused, completed]
    RunStationPreparationStatus:
      type: string
      enum: [not_started, in_progress, ready, not_required]
    RunStationProgress:
      type: object
      additionalProperties: false
      properties:
        stationId:
          type: string
          minLength: 1
          maxLength: 80
        stationName:
          type: string
          minLength: 1
          maxLength: 80
        area:
          $ref: "#/components/schemas/FacilityStationArea"
        order:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        status:
          $ref: "#/components/schemas/RunStationProgressStatus"
        producedCount:
          type: integer
          minimum: 0
          maximum: 2147483647
        preparationStatus:
          $ref: "#/components/schemas/RunStationPreparationStatus"
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        completedCases:
          type: integer
          minimum: 0
          maximum: 2147483647
        countUpdatedAt:
          type: ["string", "null"]
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required: [stationId, stationName, area, order, status, producedCount, preparationStatus, revision, completedCases, countUpdatedAt, updatedAt]
    RunStationProgressUpdate:
      type: object
      additionalProperties: false
      properties:
        commandId:
          type: string
          format: uuid
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        producedCount:
          type: integer
          minimum: 0
          maximum: 2147483647
        preparationStatus:
          $ref: "#/components/schemas/RunStationPreparationStatus"
      required: [commandId, expectedRevision, producedCount, preparationStatus]
    RunStationProgressUpdateResult:
      type: object
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum: [accepted]
        replayed:
          type: boolean
        station:
          $ref: "#/components/schemas/RunStationProgress"
      required: [outcome, replayed, station]
    RunStationProgressConflict:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        current:
          $ref: "#/components/schemas/RunStationProgress"
      required: [error, current]
    RunStationCountUpdate:
      type: object
      additionalProperties: false
      properties:
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        completedCases:
          type: integer
          minimum: 0
          maximum: 2147483647
      required: [expectedRevision, completedCases]
    RunRequirementProgressArea:
      type: object
      properties:
        area:
          $ref: "#/components/schemas/FacilityStationArea"
        stationCount:
          type: integer
          minimum: 0
          maximum: 50
        completedCases:
          type: ["integer", "null"]
          minimum: 0
          maximum: 2147483647
        remainingCases:
          type: ["integer", "null"]
          minimum: 0
          maximum: 2147483647
      required: [area, stationCount, completedCases, remainingCases]
    RunRequirementProgressItem:
      type: object
      properties:
        id: {type: string}
        area:
          anyOf:
            - $ref: "#/components/schemas/FacilityStationArea"
            - type: "null"
        completedCases:
          type: ["integer", "null"]
          minimum: 0
          maximum: 2147483647
        remainingCases:
          type: ["integer", "null"]
          minimum: 0
          maximum: 2147483647
        remainingRequired:
          type: ["number", "null"]
        remainingBatchesExact:
          type: ["number", "null"]
        remainingWholeBatches:
          type: ["integer", "null"]
          minimum: 0
        remainingRemainder:
          type: ["number", "null"]
        remainingIngredients:
          type: array
          items:
            $ref: "#/components/schemas/RunIngredientRequirement"
        proposedUsage:
          type: array
          items:
            $ref: "#/components/schemas/ProposedIngredientUsage"
      required: [id, area, completedCases, remainingCases, remainingRequired, remainingBatchesExact, remainingWholeBatches, remainingRemainder, remainingIngredients, proposedUsage]
    RunRequirementsProgress:
      type: object
      properties:
        targetCases:
          type: integer
          minimum: 1
          maximum: 1000000
        areas:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/RunRequirementProgressArea"
        items:
          type: array
          maxItems: 400
          items:
            $ref: "#/components/schemas/RunRequirementProgressItem"
      required: [targetCases, areas, items]
    RunStationProgressList:
      type: object
      additionalProperties: false
      properties:
        initialized:
          type: boolean
        currentRequirements:
          anyOf:
            - $ref: "#/components/schemas/RunRequirementsProgress"
            - type: "null"
        stations:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RunStationProgress"
      required: [initialized, currentRequirements, stations]
    Facility:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, createdAt]
    FacilityContext:
      type: object
      properties:
        facility:
          anyOf:
            - $ref: "#/components/schemas/Facility"
            - type: "null"
        role:
          anyOf:
            - type: string
              enum: [owner, manager, operator]
            - type: "null"
      required: [facility, role]
    FacilityInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required: [name]
    FacilityAssignableRole:
      type: string
      enum: [manager, operator]
    FacilityMemberRole:
      type: string
      enum: [owner, manager, operator]
    FacilityMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/FacilityMemberRole"
      required: [id, email, role]
    FacilityMemberList:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/FacilityMember"
        pendingInvitations:
          type: array
          items:
            $ref: "#/components/schemas/FacilityInvitation"
      required: [members, pendingInvitations]
    FacilityInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/FacilityAssignableRole"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [id, email, role, createdAt, expiresAt]
    FacilityMemberInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          $ref: "#/components/schemas/FacilityAssignableRole"
      required: [email, role]
    FacilityMemberUpdate:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/FacilityAssignableRole"
      required: [role]
    FacilityMemberInviteResult:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/FacilityAssignableRole"
        status:
          type: string
          enum: [added, invited]
      required: [email, role, status]
    V2Session:
      type: object
      properties:
        csrfToken:
          type: string
      required: [csrfToken]
    RunSetup:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        targetCases:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        productProfileId:
          type: [string, "null"]
          format: uuid
        planning:
          $ref: "#/components/schemas/RunPlanningReview"
      required: [label, targetCases]
    RunPlanningReview:
      type: object
      additionalProperties: false
      properties:
        expectedProfileRevision: {type: integer, minimum: 0}
        expectedNameRevision: {type: integer, minimum: 0}
        options:
          $ref: "#/components/schemas/RunPlanningOptions"
      required: [expectedProfileRevision, expectedNameRevision, options]
    RunPlanningOptions:
      type: object
      additionalProperties: false
      properties:
        unitsPerCase: {type: integer, minimum: 1, maximum: 1000}
