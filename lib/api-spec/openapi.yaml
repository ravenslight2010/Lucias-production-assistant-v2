openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Run-control API for Lucia's Production Assistant V2
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: facilities
    description: Facility setup and context
  - name: facility-members
    description: Facility membership and invitations
  - name: runs
    description: Facility-scoped production run control
  - name: dashboard
    description: Production overview
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /facility/context:
    get:
      operationId: getFacilityContext
      tags: [facilities]
      summary: Get the signed-in user's facility
      security:
        - clerkSession: []
      responses:
        "200":
          description: Facility context, or null before setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v2/session:
    post:
      operationId: createV2Session
      tags: [facilities]
      summary: Create an API session from the current Clerk session
      description: Issues a separate short-lived V2 cookie bound to the verified Clerk user and session. V1 cookies and credentials are never accepted.
      security:
        - clerkSession: []
      responses:
        "200":
          description: V2 session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteV2Session
      tags: [facilities]
      summary: Revoke the current API session
      security:
        - v2Session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session cookie cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
  /facilities:
    post:
      operationId: createFacility
      tags: [facilities]
      summary: Create a facility for the signed-in user
      security:
        - v2Session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityInput"
      responses:
        "201":
          description: Facility created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /facility/members:
    get:
      operationId: listFacilityMembers
      tags: [facility-members]
      summary: List facility members for an owner
      security:
        - v2Session: []
      responses:
        "200":
          description: Facility members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityMemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: inviteFacilityMember
      tags: [facility-members]
      summary: Add or invite a facility member
      description: Existing accounts are added immediately; new accounts receive a Clerk invitation with the selected facility role.
      security:
        - v2Session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityMemberInput"
      responses:
        "201":
          description: Member added or invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityMemberInviteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /facility/members/{memberId}:
    patch:
      operationId: updateFacilityMember
      tags: [facility-members]
      summary: Change a facility member role
      security:
        - v2Session: []
      parameters:
        - in: path
          name: memberId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityMemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeFacilityMember
      tags: [facility-members]
      summary: Remove a facility member
      security:
        - v2Session: []
      parameters:
        - in: path
          name: memberId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Member removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /facility/invitations/{invitationId}:
    delete:
      operationId: cancelFacilityInvitation
      tags: [facility-members]
      summary: Cancel a pending facility invitation
      security:
        - v2Session: []
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Invitation cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: Invitation could not be revoked in Clerk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v2/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List runs for the authenticated facility
      security:
        - v2Session: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Facility runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createRun
      tags: [runs]
      summary: Create a planned run
      description: Reusing requestId with identical setup returns the original run; reusing it with different setup returns 409.
      security:
        - v2Session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreateInput"
      responses:
        "201":
          description: Planned run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "200":
          description: Previously created run returned after an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v2/runs/{runId}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get a run from the authenticated facility
      security:
        - v2Session: []
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Production run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v2/runs/{runId}/commands:
    post:
      operationId: applyRunCommand
      tags: [runs]
      summary: Apply a revision-guarded run lifecycle command
      security:
        - v2Session: []
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/RunCommandRequest"
      responses:
        "200":
          description: Command applied or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stale revision or invalid transition with the current state
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RunConflict"
                  - $ref: "#/components/schemas/InvalidTransition"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the facility's run summary and recent activity
      security:
        - v2Session: []
      responses:
        "200":
          description: Facility production overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Sign in required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Facility access is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found in the signed-in user's facility
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State changed or command conflicts with current revision
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    RunStatus:
      type: string
      enum: [planned, running, paused, completed]
    Facility:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, createdAt]
    FacilityContext:
      type: object
      properties:
        facility:
          anyOf:
            - $ref: "#/components/schemas/Facility"
            - type: "null"
        role:
          anyOf:
            - type: string
              enum: [owner, manager, operator]
            - type: "null"
      required: [facility, role]
    FacilityInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required: [name]
    FacilityAssignableRole:
      type: string
      enum: [manager, operator]
    FacilityMemberRole:
      type: string
      enum: [owner, manager, operator]
    FacilityMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/FacilityMemberRole"
      required: [id, email, role]
    FacilityMemberList:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/FacilityMember"
        pendingInvitations:
          type: array
          items:
            $ref: "#/components/schemas/FacilityInvitation"
      required: [members, pendingInvitations]
    FacilityInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/FacilityAssignableRole"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [id, email, role, createdAt, expiresAt]
    FacilityMemberInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          $ref: "#/components/schemas/FacilityAssignableRole"
      required: [email, role]
    FacilityMemberUpdate:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/FacilityAssignableRole"
      required: [role]
    FacilityMemberInviteResult:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/FacilityAssignableRole"
        status:
          type: string
          enum: [added, invited]
      required: [email, role, status]
    V2Session:
      type: object
      properties:
        csrfToken:
          type: string
      required: [csrfToken]
    RunSetup:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        targetCases:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required: [label, targetCases]
    PauseInterval:
      type: object
      properties:
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, "null"]
          format: date-time
      required: [startedAt, endedAt]
    Run:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RunStatus"
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        pausedAt:
          type: [string, "null"]
          format: date-time
        resumedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        setupSnapshot:
          $ref: "#/components/schemas/RunSetup"
        pauseIntervals:
          type: array
          items:
            $ref: "#/components/schemas/PauseInterval"
      required:
        - id
        - status
        - revision
        - createdAt
        - updatedAt
        - startedAt
        - pausedAt
        - resumedAt
        - completedAt
        - setupSnapshot
        - pauseIntervals
    RunCreateInput:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        setupSnapshot:
          $ref: "#/components/schemas/RunSetup"
      required: [requestId, setupSnapshot]
    RunCommandRequest:
      type: object
      properties:
        commandId:
          type: string
          minLength: 1
          maxLength: 200
        commandType:
          type: string
          enum: [start, pause, resume, complete]
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required: [commandId, commandType, expectedRevision]
    RunList:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
      required: [runs]
    RunEnvelope:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/Run"
      required: [run]
    RunCreated:
      type: object
      properties:
        outcome:
          const: created
        replayed:
          type: boolean
        run:
          $ref: "#/components/schemas/Run"
      required: [outcome, replayed, run]
    RunCommandAccepted:
      type: object
      properties:
        outcome:
          const: accepted
        replayed:
          type: boolean
        commandId:
          type: string
        run:
          $ref: "#/components/schemas/Run"
      required: [outcome, replayed, commandId, run]
    RunConflict:
      type: object
      properties:
        outcome:
          const: conflict
        expectedRevision:
          type: integer
        currentRun:
          $ref: "#/components/schemas/Run"
      required: [outcome, expectedRevision, currentRun]
    InvalidTransition:
      type: object
      properties:
        outcome:
          const: invalid_transition
        currentStatus:
          $ref: "#/components/schemas/RunStatus"
      required: [outcome, currentStatus]
    DashboardSummary:
      type: object
      properties:
        facility:
          $ref: "#/components/schemas/Facility"
        counts:
          type: object
          properties:
            active:
              type: integer
            planned:
              type: integer
            completed:
              type: integer
          required: [active, planned, completed]
        activeRuns:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        recentRuns:
          type: array
          items:
            $ref: "#/components/schemas/Run"
      required: [facility, counts, activeRuns, recentRuns]
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
    v2Session:
      type: apiKey
      in: cookie
      name: v2_session

